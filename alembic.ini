# Configuration Alembic.
# L'URL réelle est injectée dynamiquement depuis bot.config (variable DATABASE_URL),
# voir alembic/env.py — la valeur ci-dessous n'est qu'un repli.
[alembic]
script_location = alembic
prepend_sys_path = .
# Repli si DATABASE_URL n'est pas défini (dev local).
sqlalchemy.url = sqlite+aiosqlite:///./data/bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
